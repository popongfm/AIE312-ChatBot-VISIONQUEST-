name: pipeline
on:
  pull_request:
  push:

jobs:
  # Every push and PR: tests, then build the Docker image and check it actually starts.
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionquest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/visionquest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: visionquest:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and reaches the database
        run: |
          docker run -d --name api --network host -e DATABASE_URL="$TEST_DATABASE_URL" -e PORT=3000 visionquest:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:3000/api/health || true)
            echo "$body" | grep -q '"version":"${{ github.sha }}"' && { echo "$body"; exit 0; }
            sleep 2
          done
          docker logs api
          exit 1

  # Merges to main only: push the image, update the database, deploy on Render, then smoke-test production.
  # Each stage runs once its secrets exist, so the pipeline stays green while accounts are still being set up.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Which stages are configured
        id: stages
        run: |
          has() { [ -n "${!1}" ]; }
          if has DOCKERHUB_USERNAME && has DOCKERHUB_TOKEN; then echo "image=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Skipping image push: add secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"; fi
          if has DATABASE_URL; then echo "database=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Skipping migrate and seed: add secret DATABASE_URL"; fi
          if has DOCKERHUB_USERNAME && has DOCKERHUB_TOKEN && has RENDER_DEPLOY_HOOK_URL && has PUBLIC_URL; then echo "release=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Skipping Render deploy: add secret RENDER_DEPLOY_HOOK_URL and variable PUBLIC_URL"; fi

      - if: steps.stages.outputs.image == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.stages.outputs.image == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image to Docker Hub
        if: steps.stages.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/visionquest:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/visionquest:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - if: steps.stages.outputs.database == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.stages.outputs.database == 'true'
        run: npm ci
      - name: Migrate production database
        if: steps.stages.outputs.database == 'true'
        run: npm run migrate -w @vq/api
      - name: Load seed/ into production database
        if: steps.stages.outputs.database == 'true'
        run: npm run seed -w @vq/api

      - name: Deploy this image on Render
        if: steps.stages.outputs.release == 'true'
        run: |
          image="docker.io/${DOCKERHUB_USERNAME}/visionquest:${{ github.sha }}"
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=$(jq -rn --arg v "$image" '$v|@uri')"
      - name: Smoke test production
        if: steps.stages.outputs.release == 'true'
        run: |
          # Free Render instances may be asleep: allow up to 10 minutes for the new version to come up.
          for i in $(seq 1 60); do
            body=$(curl -fsS --max-time 30 "$PUBLIC_URL/api/health" || true)
            if echo "$body" | grep -q '"version":"${{ github.sha }}"'; then
              echo "health: $body"
              curl -fsS --max-time 30 "$PUBLIC_URL/api/portfolio" > /dev/null
              echo "portfolio: ok"
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported version ${{ github.sha }}; last /api/health: $body"
          exit 1
