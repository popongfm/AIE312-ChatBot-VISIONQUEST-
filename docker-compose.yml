# Local Postgres for development. Credentials match CI (.github/workflows/pipeline.yml).
# Start: docker compose up -d   Stop: docker compose stop   Wipe data: docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visionquest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visionquest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
